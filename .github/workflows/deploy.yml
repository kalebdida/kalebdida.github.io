name: deploy

# the site's code lives on the `source` branch.
# every push here builds the site and publishes the result to `main`,
# which github pages serves at https://kalebdida.github.io
on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: publish dist to main
        run: |
          cp scripts/published-readme.md dist/README.md
          cd dist
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" main
      - name: tell Bing and other IndexNow engines what changed
        continue-on-error: true
        run: |
          sleep 90
          urls=$(grep -o '<loc>[^<]*' dist/sitemap.xml | sed 's/<loc>//' | jq -R . | jq -s -c .)
          curl -sS -o /dev/null -w "IndexNow %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"kalebdida.github.io\",\"key\":\"21b8f0656a6c5f55b372bc34cd8e3cbc\",\"keyLocation\":\"https://kalebdida.github.io/21b8f0656a6c5f55b372bc34cd8e3cbc.txt\",\"urlList\":$urls}"
