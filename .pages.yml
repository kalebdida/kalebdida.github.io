# In Pages CMS, choose the source branch before editing.
media:
  input: public/uploads
  output: /uploads
content:
  - name: posts
    label: "Posts: write or link"
    type: collection
    path: content/posts
    format: yaml-frontmatter
    filename: "{primary}.md"
    subfolders: false
    view:
      fields:
        - title
        - date
        - status
        - draft
      primary: title
      sort:
        - date
        - title
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: Give your post a clear title.
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
        description: Choose the publication date. Use the actual date, not a guessed one.
      - name: summary
        label: Summary
        type: text
        required: true
        description: A short introduction shown on note cards and in the feed.
      - name: tags
        label: Tags
        type: string
        list: true
        required: true
        description: Add a few topics, such as Robotics or Cognitive science.
      - name: draft
        label: Draft (hidden from the site and feeds)
        type: boolean
        default: true
        required: true
        description: Keep this on while writing. Turn it off to make the post public.
      - name: status
        label: Status
        type: select
        required: true
        default: outline
        options:
          values:
            - outline
            - published
        description: Published means the piece is ready. Outline shows a gentle
          in-progress note and stays off the home page.
      - name: thumbnail
        label: Thumbnail
        type: image
        description: Upload an image here. Leave blank for a patterned cover.
      - name: external_url
        label: External URL (leave blank for a local post)
        type: string
        pattern:
          regex: ^$|^https://
          message: Use a full HTTPS URL.
        description: Leave empty unless this post lives on Medium or Substack. Paste the
          full HTTPS link to that piece.
      - name: external_platform
        label: External platform
        type: select
        options:
          values:
            - medium
            - substack
        description: Leave empty for a post written here. Choose Medium or Substack for
          a link post.
      - name: body
        label: Write your post
        type: rich-text
        description: Write your post here. Use Heading 2 for sections. For a link post,
          this can stay empty.
    description: Write a note here, or add a link to a piece on Medium or Substack.
      Save on the source branch.
  - name: site
    label: Site
    type: file
    path: content/site.json
    format: json
    fields:
      - name: identity
        label: Identity
        type: object
        fields:
          - name: name
            label: Name
            type: string
          - name: shortName
            label: Short Name
            type: string
          - name: handle
            label: Handle
            type: string
          - name: geezName
            label: Geez Name
            type: string
          - name: url
            label: Url
            type: string
          - name: email
            label: Email
            type: string
          - name: city
            label: City
            type: string
          - name: timeZone
            label: Time Zone
            type: string
          - name: title
            label: Title
            type: string
          - name: tagline
            label: Tagline
            type: text
          - name: intro
            label: Intro
            type: text
          - name: portraitDark
            label: Dark-theme portrait
            type: image
            description: The black-and-white transparent portrait, used in dark mode.
          - name: portraitLight
            label: Light-theme portrait
            type: image
            description: The color transparent portrait, used in light mode.
      - name: about
        label: About
        type: object
        fields:
          - name: lead
            label: Lead
            type: text
            description: One strong lead sentence for About.
          - name: paragraphs
            label: Paragraphs
            type: text
            list: true
            hidden: true
          - name: facts
            label: Facts
            type: object
            fields:
              - name: key
                label: Key
                type: string
              - name: value
                label: Value
                type: string
            list: true
          - name: homeParagraph
            label: About paragraph on home
            type: text
            description: Write one short paragraph. This is the paragraph visitors see.
      - name: disciplines
        label: Disciplines
        type: object
        fields:
          - name: id
            label: Id
            type: string
            required: true
            description: Stable identifier. Keep existing IDs unchanged.
          - name: title
            label: Title
            type: string
          - name: text
            label: Text
            type: text
        list: true
      - name: offScreen
        label: Off Screen
        type: object
        fields:
          - name: id
            label: Id
            type: string
            required: true
            description: Stable identifier. Keep existing IDs unchanged.
          - name: label
            label: Label
            type: string
          - name: text
            label: Text
            type: text
          - name: href
            label: Link
            type: string
            description: Optional full HTTPS address, such as the Telegram writing channel.
          - name: linkLabel
            label: Link text
            type: string
            description: Short text describing where the link opens.
        list: true
      - name: now
        label: Now
        type: object
        fields:
          - name: updated
            label: Updated
            type: string
          - name: season
            label: Season
            type: string
          - name: items
            label: Items
            type: object
            fields:
              - name: category
                label: Category
                type: string
              - name: detail
                label: Detail
                type: text
            list: true
      - name: socials
        label: Socials
        type: object
        fields:
          - name: label
            label: Label
            type: string
          - name: handle
            label: Handle
            type: string
          - name: href
            label: Href
            type: string
        list: true
      - name: keywords
        label: Moving keyword line
        type: string
        list: true
        description: Short topics shown between About and What I do.
  - name: projects
    label: Projects
    type: file
    path: content/projects.json
    format: json
    list: true
    fields:
      - name: id
        label: Id
        type: string
        required: true
        description: Stable identifier. Keep existing IDs unchanged.
      - name: slug
        label: Slug
        type: string
        required: true
        description: Stable identifier. Keep existing IDs unchanged.
      - name: title
        label: Title
        type: string
      - name: year
        label: Year
        type: string
      - name: status
        label: Status
        type: select
        options:
          values:
            - In use, still building
            - Building
            - Done
            - Presented
      - name: kind
        label: Kind
        type: string
      - name: summary
        label: Summary
        type: text
      - name: whatItIs
        label: What It Is
        type: text
      - name: built
        label: Built
        type: string
        list: true
      - name: next
        label: Next
        type: string
        list: true
      - name: stack
        label: Stack
        type: string
        list: true
      - name: role
        label: Role
        type: string
      - name: links
        label: Links
        type: object
        fields:
          - name: label
            label: Label
            type: string
          - name: href
            label: Href
            type: string
        list: true
      - name: homeSummary
        label: Short home-page summary
        type: text
        description: One sentence. Detailed descriptions remain inside the case file.
      - name: photo
        label: Project photo
        type: image
        description: Optional. Upload a real project image for the hover preview and
          case file.
  - name: journey
    label: Journey
    type: file
    path: content/journey.json
    format: json
    list: true
    fields:
      - name: id
        label: Id
        type: string
        required: true
        description: Stable identifier. Keep existing IDs unchanged.
      - name: when
        label: When
        type: string
      - name: title
        label: Title
        type: string
      - name: place
        label: Place
        type: string
      - name: note
        label: Note
        type: text
      - name: showOnHome
        label: Show on home page
        type: boolean
        default: false
        description: Turn on to include this item on the home page. The full resume
          keeps all entries.
      - name: homeSummary
        label: Short home-page line
        type: text
        description: One short line for the home page. Keep full details in the other
          fields.
  - name: recognition
    label: Recognition
    type: file
    path: content/recognition.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
      - name: detail
        label: Detail
        type: text
      - name: scope
        label: Scope
        type: string
      - name: showOnHome
        label: Show on home page
        type: boolean
        default: false
        description: Turn on to include this item on the home page. The full resume
          keeps all entries.
      - name: homeDetail
        label: Short home-page detail
        type: text
        description: A short description for the home page. The full detail remains on
          the resume.
  - name: resume
    label: Resume
    type: file
    path: content/resume.json
    format: json
    fields:
      - name: title
        label: Title
        type: string
      - name: education
        label: Education
        type: object
        fields:
          - name: school
            label: School
            type: string
          - name: place
            label: Place
            type: string
          - name: period
            label: Period
            type: string
          - name: notes
            label: Notes
            type: text
        list: true
      - name: experience
        label: Experience
        type: object
        fields:
          - name: role
            label: Role
            type: string
          - name: org
            label: Org
            type: string
          - name: when
            label: When
            type: string
          - name: notes
            label: Notes
            type: text
        list: true
      - name: skills
        label: Skills
        type: object
        fields:
          - name: group
            label: Group
            type: string
          - name: items
            label: Items
            type: string
            list: true
        list: true
